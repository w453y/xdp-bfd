# /etc/xdp-bfd/engine.conf - arguments for the xdp-bfd service.
#
# Ships empty, and the unit ships disabled, so nothing starts until you
# set the arguments and run:
#   systemctl enable --now xdp-bfd
#
# With FRR bfdd, the usual deployment. Point bfdd at 127.0.0.1:50700 (see
# examples/frr-daemons.snippet) and replace eth0 with the interface the
# BFD peers are reached over:
#   XDP_BFD_ARGS="--dplane 50700 --dp-peer frr --kernel-tx eth0"
#
# --kernel-tx is what attaches the XDP fast path. Without it the engine
# still serves bfdd, but in software only. See xdp-bfd(8) for peers spread
# across several interfaces.
#
# Standalone, one static session, no bfdd:
#   XDP_BFD_ARGS="192.0.2.1 192.0.2.2 --kernel-tx eth0"
#
XDP_BFD_ARGS=""
