[pytest]
# No cache directory. These suites run under sudo, so pytest would
# write .pytest_cache as root - and on a self-hosted runner the
# checkout step then cannot delete it, failing every later run with
# EACCES before a single test starts.
addopts = -p no:cacheprovider
markers =
    frr: needs a container runtime and pulls the FRR image; not in the
        default netns run
