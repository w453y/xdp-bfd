# The end-to-end suites under tests/e2e. Unit suites are C binaries run by the
# Makefile.
[pytest]
# No cache: under sudo it would be root-owned, and the next checkout could not
# remove it.
addopts = -p no:cacheprovider
markers =
    frr: needs a container runtime and pulls the FRR image; not in the
        default netns run
