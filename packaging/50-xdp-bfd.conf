# Reserve the xdp-bfd data-plane control port so the kernel's ephemeral
# port allocator never hands it to another socket. 50700 is the port
# bfdd connects to (see /etc/xdp-bfd/engine.conf and the frr-daemons
# example); if you move it, change it in all three places together.
net.ipv4.ip_local_reserved_ports = 50700
