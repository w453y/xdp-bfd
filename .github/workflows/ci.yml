name: ci

#   full         self-hosted: build, unit suites, fuzz corpus, and the
#                namespace and FRR end-to-end suites. The FRR scenarios read
#                BPF maps through bpftool, which hosted runners cannot do.
#   toolchain    the clang floor, asserted in both directions.
#   kernel       unit suites under a chosen kernel in a microVM.
#   cross        the BPF object builds for a non-host architecture.
#   compilers    hosted, stock machine: build and unit suites under both
#                compilers.
#   static-analysis  scan-build over the engine, any finding fails.
on:
  pull_request:
  # Every branch, not just main. A merge commit is a different tree from the
  # branch that was tested and a direct push has no pull-request run at all,
  # which was the original reason for main being here - but restricting it to
  # main meant a branch got no CI until someone opened a pull request, and a
  # 27 commit branch reached merge having never been built by anything but
  # its author. Two breakages arrived that way: the fuzz target stopped
  # linking, and a static analysis finding sat unreported, both caught only
  # at the first pull request.
  #
  # A branch that does have a pull request open is therefore built twice,
  # once per event. That is deliberate and it costs the six hosted arms; the
  # two self-hosted jobs skip push events below, so the shared VM is not
  # contended for.
  push:
    branches: ['**']
  workflow_dispatch:

# Read-only. Nothing here comments, tags, or publishes.
permissions:
  contents: read

# `full` and `kernel` share one self-hosted VM, so concurrent runs on a ref
# serialise. Cancel the older one rather than queue behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: [self-hosted, Linux, X64]
    # One VM, shared with `kernel`. A push to a branch gets the hosted arms
    # and leaves this for the pull request, so a branch under active work
    # does not hold the machine.
    if: github.event_name != 'push'
    timeout-minutes: 30
    env:
      BFD_CONTAINER_RUNTIME: podman
      # Suites run under sudo, so anything Python writes lands root-owned and
      # the next checkout - which runs as the runner user - cannot remove it.
      # pytest.ini disables its own cache for the same reason.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      # The work directory persists between runs, so a job that died mid-test
      # leaves engines, namespaces, veths and containers behind. A leaked
      # engine still holds an XDP attach and fails the next run's setup.
      - name: clean up anything a previous run left
        run: |
          sudo pkill -f 'bfd_tx 10.77' || true
          sudo pkill -f 'bfd_tx --dplane 50700' || true
          sudo ip netns del bfdrig-a 2>/dev/null || true
          sudo ip netns del bfdrig-b 2>/dev/null || true
          sudo podman rm -f bfdrig-frr-a bfdrig-frr-b 2>/dev/null || true
          sudo ip link del eth-a 2>/dev/null || true
          sudo ip link del rig-a 2>/dev/null || true
          sudo find . -user root -exec rm -rf {} + 2>/dev/null || true
          true

      # clang 21, bpftool, podman and pytest are preinstalled on this VM.
      - name: versions
        run: |
          clang-21 --version | head -1
          bpftool version | head -1
          podman --version
          python3 -m pytest --version
          uname -r

      - name: build
        run: make CLANG=clang-21

      - name: unit suites
        run: sudo make CLANG=clang-21 check

      - name: fuzz regressions
        run: |
          make FUZZ_CC=clang-21 tests/unit/dp_fuzz
          find tests/unit/fuzz-regress -type f ! -name '*.md' \
            -exec ./tests/unit/dp_fuzz {} +

      - name: netns end-to-end
        run: sudo make CLANG=clang-21 check-netns

      # Against stock FRR. Needs bpftool map access, so it only runs here.
      - name: frr scenarios
        run: sudo -E make CLANG=clang-21 check-frr

      # Again at the end, so a failed run does not leave the VM dirty.
      - name: leave the machine clean
        if: always()
        run: |
          sudo pkill -f 'bfd_tx 10.77' || true
          sudo pkill -f 'bfd_tx --dplane 50700' || true
          sudo ip netns del bfdrig-a 2>/dev/null || true
          sudo ip netns del bfdrig-b 2>/dev/null || true
          sudo podman rm -f bfdrig-frr-a bfdrig-frr-b 2>/dev/null || true
          sudo ip link del eth-a 2>/dev/null || true
          sudo ip link del rig-a 2>/dev/null || true
          sudo find . -user root -exec rm -rf {} + 2>/dev/null || true
          true

  # The clang floor. Below LLVM 20 the BPF backend has no 32-bit atomic
  # compare-and-swap, so sweep.h's __sync_val_compare_and_swap crashes the
  # compiler. Both sides are asserted: below the floor must fail, and fail
  # on that specific error rather than on some unrelated breakage.
  # Every supported clang builds the object. It used to be a floor check:
  # below clang 20 the BPF backend had no 32-bit atomic compare-and-swap
  # and refused the object at compile. The CAS targets are __u64 now
  # (session_state.alive, sweep.inited), so that build-time floor is gone
  # and clang 14 up all compile.
  #
  # The real floor moved to load time and is codegen-dependent: clang 14
  # produces an object the verifier refuses ("combined stack size 528, too
  # large"), clang 19 produces one that loads. This hosted job has no BPF
  # kernel and can only confirm the compile; the `kernel` job below builds
  # with clang-21 and loads it under a real kernel, which is the load
  # regression guard for the version we ship. The exact sub-floor boundary
  # (which clang between 15 and 18 first loads) is a pending bisect in the
  # packaging plan, not a regression gate, so it is not asserted anywhere.
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - llvm: 18
            preinstalled: "true"   # ubuntu-latest ships clang-18
          - llvm: 19
          - llvm: 20
          - llvm: 21
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/llvm
        with:
          version: ${{ matrix.llvm }}
          preinstalled: ${{ matrix.preinstalled || 'false' }}

      - name: build with clang-${{ matrix.llvm }}
        run: |
          if ! make CLANG=clang-${{ matrix.llvm }} >/tmp/b.log 2>&1; then
            tail -30 /tmp/b.log
            echo "clang-${{ matrix.llvm }} no longer builds the object."
            echo "If a 32-bit atomic came back, widen its target to __u64;"
            echo "see session_state.alive in include/bfd_shared.h."
            exit 1
          fi

  kernel:
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name != 'push'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - "7.0.0-30-generic"
    steps:
      - uses: actions/checkout@v4

      - name: build on the host
        run: make CLANG=clang-21 && make CLANG=clang-21 tests/unit/bfd_xdp_test.o

      # Kernel images install mode 600; virtme-ng reads one as the runner user.
      - name: make the kernel image readable
        run: |
          test -f /boot/vmlinuz-${{ matrix.kernel }} || {
            sudo apt-get update
            sudo apt-get install -y linux-image-${{ matrix.kernel }}
          }
          sudo chmod 644 /boot/vmlinuz-${{ matrix.kernel }}

      - name: run the suites under ${{ matrix.kernel }}
        run: |
          vng -r ${{ matrix.kernel }} --rwdir=$PWD -- \
            sh -c "cd $PWD && make CLANG=clang-21 check" 2>&1 | tee /tmp/vng.log
          # vng propagates the inner exit status, but the pipe through tee
          # would mask it, so assert on the output too.
          grep -q 'all suites passed' /tmp/vng.log

  # The BPF object is target-independent bytecode, but BPFFLAGS carries
  # -I/usr/include/$(TRIPLE) for the kernel UAPI headers, and that triple
  # must not be hardcoded to the host's. Codegen only: no cross libbpf and
  # no linking.
  #
  # Both arms matter. A bogus triple must fail on <asm/types.h>, or the -I
  # is decorative and the aarch64 arm proves nothing.
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # bpf/bpf_helpers.h is architecture-independent, so the host's amd64
      # libbpf-dev serves the aarch64 build. Only the UAPI headers under
      # /usr/include/<triple> are arch-specific, which is what the arm64
      # step below is for.
      - uses: ./.github/actions/llvm
        with:
          version: 21

      - name: add arm64 headers
        run: |
          # Ubuntu splits architectures across mirrors: archive.ubuntu.com
          # carries amd64 only, everything else lives on ports.ubuntu.com.
          # Adding arm64 without scoping the existing sources makes apt ask
          # the amd64 mirror for arm64 indices and every one 404s.
          sudo dpkg --add-architecture arm64
          for f in /etc/apt/sources.list.d/*.sources; do
            sudo sed -i '/^Architectures:/d' "$f"
            sudo sed -i '/^Types:/a Architectures: amd64' "$f"
          done
          printf '%s\n' \
            'Types: deb' \
            'URIs: http://ports.ubuntu.com/ubuntu-ports' \
            'Suites: noble noble-updates' \
            'Components: main universe' \
            'Architectures: arm64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            | sudo tee /etc/apt/sources.list.d/arm64.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y linux-libc-dev:arm64
          ls -d /usr/include/aarch64-linux-gnu

      - name: build the BPF object for aarch64
        run: make CLANG=clang-21 TRIPLE=aarch64-linux-gnu bfd_xdp.o

      - name: a bogus triple must fail on asm/types.h
        run: |
          touch src/xdp/bfd_xdp.c
          if make CLANG=clang-21 TRIPLE=does-not-exist bfd_xdp.o >/tmp/x.log 2>&1; then
            echo "built with a nonexistent include path; the -I is not"
            echo "load-bearing and the aarch64 arm proves nothing"
            exit 1
          fi
          grep -q 'asm/types.h' /tmp/x.log || {
            echo "failed, but not on the missing header:"; tail -5 /tmp/x.log; exit 1; }

  # Userspace with both compilers. The BPF object is always clang; this
  # axis is the engine, and it exists because the multiarch triple must be
  # derived from the system rather than from $(CC).
  compilers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [cc, clang-21]
    steps:
      - uses: actions/checkout@v4

      # clang 21 from apt.llvm.org: the runner image defaults to 18, which is
      # below the floor the toolchain job asserts.
      - uses: ./.github/actions/llvm
        with:
          version: 21
          packages: linux-tools-common

      - name: show the multiarch triple
        run: ls /usr/include/$(gcc -print-multiarch) | head -5

      - name: build
        run: make CC=${{ matrix.cc }} CLANG=clang-21

      - name: unit suites
        run: sudo make CC=${{ matrix.cc }} CLANG=clang-21 check

  # Its own job rather than a step on the end of the compiler matrix, where
  # a finding was reported as "portability (cc) failed" and said nothing
  # about what had been found. It also ran twice over one codebase, since
  # scan-build uses its own clang whatever $(CC) is.
  #
  # --status-bugs makes any finding fail the job.
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/llvm
        with:
          version: 21
          packages: clang-tools-21

      - name: scan-build
        run: scan-build-21 --status-bugs -o /tmp/sb make bfd_tx bfd_loader

  package:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'debian:12',    suite: debian-12,   kind: deb }
          - { image: 'debian:13',    suite: debian-13,   kind: deb }
          - { image: 'ubuntu:24.04', suite: ubuntu-2404, kind: deb }
          - { image: 'fedora:42',    suite: fedora-42,   kind: rpm }
    container: ${{ matrix.image }}
    steps:
      - name: git for checkout
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y -qq git
          else
            dnf install -y -q git
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: build ${{ matrix.kind }}
        run: tools/ci-package.sh ${{ matrix.kind }}
      - uses: actions/upload-artifact@v4
        with:
          name: xdp-bfd-${{ matrix.suite }}
          path: dist/**
          if-no-files-found: error
