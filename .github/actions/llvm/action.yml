name: install llvm
description: >
  clang at a chosen major version from apt.llvm.org, with libbpf-dev and
  any extra packages the caller names.

inputs:
  version:
    description: LLVM major version, for example 21.
    required: true
  packages:
    description: Extra apt packages, space separated.
    required: false
    default: ""
  preinstalled:
    description: >
      Use the clang the runner image already ships (ubuntu-latest has 18)
      instead of apt.llvm.org.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y llvm libbpf-dev
        if [ "${{ inputs.preinstalled }}" != "true" ]; then
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${{ inputs.version }}
        fi
        # After llvm.sh: versioned packages come from apt.llvm.org.
        if [ -n "${{ inputs.packages }}" ]; then
          sudo apt-get install -y ${{ inputs.packages }}
        fi
        clang-${{ inputs.version }} --version | head -1
