name: fuzz

# Separate from build.yml because the triggers have nothing in common: a
# fuzz run is open-ended and belongs on a clock, not on every push. The
# millisecond regression check over tests/unit/fuzz-regress/ DOES run in
# the push gate; this is the search for new findings.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'wall-clock budget'
        default: '20'

jobs:
  dp_fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm libbpf-dev
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          clang-21 --version

      - name: build
        run: make FUZZ_CC=clang-21 tests/unit/dp_fuzz

      # Known findings first. If one of these reproduces, a fix regressed
      # and that is worth failing on before spending the budget searching.
      - name: regressions
        run: find tests/unit/fuzz-regress -type f ! -name '*.md' -exec ./tests/unit/dp_fuzz {} +

      # The corpus is not committed - it would go stale against a changed
      # parser - but it should not start empty either. A cold run spends
      # most of its budget re-deriving coverage the previous night already
      # had: locally, an empty corpus reaches ~224 new units in 90 seconds
      # and then flattens. Cached so the search compounds night to night,
      # keyed on the target and the parser it drives so that changing
      # either starts fresh rather than inheriting a corpus shaped by code
      # that no longer exists. The run id in the key makes each run write a
      # new entry and restore-keys pick up the most recent, which is the
      # append-only pattern actions/cache supports.
      - name: restore corpus
        uses: actions/cache@v4
        with:
          path: corpus
          key: dp_fuzz-corpus-${{ hashFiles('tests/unit/dp_fuzz.c', 'src/engine/dplane.c') }}-${{ github.run_id }}
          restore-keys: |
            dp_fuzz-corpus-${{ hashFiles('tests/unit/dp_fuzz.c', 'src/engine/dplane.c') }}-

      # -max_total_time rather than -runs: the budget is wall clock, and
      # runs/second varies with the runner.
      - name: search
        run: |
          mkdir -p corpus
          ./tests/unit/dp_fuzz \
            -max_total_time=$(( ${{ github.event.inputs.minutes || 20 }} * 60 )) \
            -print_final_stats=1 corpus/

      # A finding is written as crash-<sha1> in the working directory and
      # would vanish with the runner otherwise. Uploaded on success too:
      # a clean run still produces the corpus, and if: failure() would
      # discard the only durable evidence of what the budget bought.
      - name: keep any finding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dp_fuzz-findings
          path: |
            crash-*
            leak-*
            timeout-*
            corpus/
          if-no-files-found: ignore
