name: fuzz

# The nightly search. Known findings are replayed in ci.yml.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'wall-clock budget'
        default: '20'

jobs:
  dp_fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm libbpf-dev
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          clang-21 --version

      - name: build
        run: make FUZZ_CC=clang-21 tests/unit/dp_fuzz

      # Known findings first: a reproduction means a fix regressed.
      - name: regressions
        run: find tests/unit/fuzz-regress -type f ! -name '*.md' -exec ./tests/unit/dp_fuzz {} +

      # Keyed on the sources, so changing them starts a fresh corpus.
      - name: restore corpus
        uses: actions/cache@v4
        with:
          path: corpus
          key: dp_fuzz-corpus-${{ hashFiles('tests/unit/dp_fuzz.c', 'src/engine/*.c') }}-${{ github.run_id }}
          restore-keys: |
            dp_fuzz-corpus-${{ hashFiles('tests/unit/dp_fuzz.c', 'src/engine/*.c') }}-

      - name: search
        run: |
          mkdir -p corpus
          ./tests/unit/dp_fuzz \
            -max_total_time=$(( ${{ github.event.inputs.minutes || 20 }} * 60 )) \
            -print_final_stats=1 corpus/

      # On success too, so the corpus survives.
      - name: keep any finding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dp_fuzz-findings
          path: |
            crash-*
            leak-*
            timeout-*
            corpus/
          if-no-files-found: ignore

  xdp_fuzz:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The runner has only clang-21, for bfd_xdp.o too.
      - name: build
        run: make CLANG=clang-21 FUZZ_CC=clang-21 tests/unit/xdp_fuzz

      - name: regressions
        run: sudo find tests/unit/fuzz-regress/xdp_fuzz -type f ! -name '*.md' -exec ./tests/unit/xdp_fuzz {} +

      - name: restore corpus
        uses: actions/cache@v4
        with:
          path: xcorpus
          key: xdp_fuzz-corpus-${{ hashFiles('tests/unit/xdp_fuzz.c', 'src/xdp/*') }}-${{ github.run_id }}
          restore-keys: |
            xdp_fuzz-corpus-${{ hashFiles('tests/unit/xdp_fuzz.c', 'src/xdp/*') }}-

      - name: search
        run: |
          mkdir -p xcorpus
          sudo ./tests/unit/xdp_fuzz \
            -max_total_time=$(( ${{ github.event.inputs.minutes || 20 }} * 60 )) \
            -print_final_stats=1 xcorpus/

      - name: keep any finding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdp_fuzz-findings
          path: |
            crash-*
            leak-*
            timeout-*
            xcorpus/
          if-no-files-found: ignore
