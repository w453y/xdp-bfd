name: fuzz

# The search for new findings, on a clock. The regression check over
# tests/unit/fuzz-regress/ is cheap and runs in the push gate instead.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'wall-clock budget'
        default: '20'

jobs:
  dp_fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm libbpf-dev
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          clang-21 --version

      - name: build
        run: make FUZZ_CC=clang-21 tests/unit/dp_fuzz

      # Known findings first: a reproduction means a fix regressed, and that
      # is worth failing on before spending the budget searching.
      - name: regressions
        run: find tests/unit/fuzz-regress -type f ! -name '*.md' -exec ./tests/unit/dp_fuzz {} +

      # The corpus is cached rather than committed, so the search compounds
      # night to night without going stale in the tree. The key covers the
      # target and the parser it drives, so changing either starts fresh
      # rather than inheriting a corpus shaped by code that is gone. The run
      # id makes each run write a new entry and restore-keys take the most
      # recent - the append-only pattern actions/cache supports.
      - name: restore corpus
        uses: actions/cache@v4
        with:
          path: corpus
          key: dp_fuzz-corpus-${{ hashFiles('tests/unit/dp_fuzz.c', 'src/engine/dplane.c') }}-${{ github.run_id }}
          restore-keys: |
            dp_fuzz-corpus-${{ hashFiles('tests/unit/dp_fuzz.c', 'src/engine/dplane.c') }}-

      # -max_total_time rather than -runs: the budget is wall clock, and
      # runs/second varies with the runner.
      - name: search
        run: |
          mkdir -p corpus
          ./tests/unit/dp_fuzz \
            -max_total_time=$(( ${{ github.event.inputs.minutes || 20 }} * 60 )) \
            -print_final_stats=1 corpus/

      # Findings are written to the working directory and would vanish with
      # the runner. Uploaded on success too, so the corpus survives.
      - name: keep any finding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dp_fuzz-findings
          path: |
            crash-*
            leak-*
            timeout-*
            corpus/
          if-no-files-found: ignore
