# /etc/xdp-bfd/engine.conf - environment for the xdp-bfd systemd service.
#
# The service runs /usr/sbin/xdp-bfd with the arguments in XDP_BFD_ARGS.
# It ships empty on purpose: the unit is installed disabled, so nothing
# starts until you set the arguments for your deployment and enable it:
#   systemctl enable --now xdp-bfd
#
# Driven by FRR bfdd over the data-plane socket (the usual deployment).
# bfdd offloads its sessions to xdp-bfd; point bfdd at 127.0.0.1:50700
# (see examples/frr-daemons.snippet in the docs) and set, replacing eth0
# with the interface the BFD peers are reached over:
#   XDP_BFD_ARGS="--dplane 50700 --dp-peer frr --kernel-tx eth0"
#
# --kernel-tx <iface> is what attaches the XDP fast path and answers from
# the kernel; without it the engine still serves bfdd but purely in
# software, which forfeits the reason to run it. One engine handles every
# session on the host, so one interface is the common case; for peers
# across several interfaces, see xdp-bfd(8).
#
# Standalone, a single static session with no bfdd:
#   XDP_BFD_ARGS="192.0.2.1 192.0.2.2 --kernel-tx eth0"
#
XDP_BFD_ARGS=""
