name: build and test

on:
  push:
    branches: [ '**' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # clang 21 from apt.llvm.org, not the archive. The BPF backend below
      # LLVM 20 has no 32-bit atomic compare-and-swap, so
      # __sync_val_compare_and_swap on sweep.h's __u32 `inited` crashes
      # the compiler outright ("unsupported atomic operation, please use
      # 64 bit version" then a backend fatal error). Measured on the DUT:
      # 18 and 19 fail, 20 and 21 build. The runner image default is 18.
      #
      # Pinning rather than widening the field: this engine targets kernel
      # 7.x and newer, and 21 is what it is developed against.
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm libbpf-dev linux-tools-common
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          clang-21 --version
          ls /usr/include/$(gcc -print-multiarch) | head -5

      - name: build
        run: make CLANG=clang-21

      # Layers 1 and 2 that need nothing special. If the XDP suite
      # fails on the runner's kernel, these still tell us the rest is
      # green rather than the whole gate going red for one reason.
      - name: abi, fsm, dp
        run: |
          make CLANG=clang-21 abi-check
          make CLANG=clang-21 test-fsm
          make CLANG=clang-21 test-dp

      - name: xdp (needs root and BPF_PROG_TEST_RUN)
        run: make CLANG=clang-21 test-xdp

      # Milliseconds. Pins the out-of-bounds read fixed in 0441f6c; the
      # open-ended fuzz run lives in fuzz.yml on a schedule.
      - name: fuzz regressions
        run: |
          make FUZZ_CC=clang-21 tests/unit/dp_fuzz
          find tests/unit/fuzz-regress -type f ! -name '*.md' -exec ./tests/unit/dp_fuzz {} +

  # Layer 3: two engines on a veth pair in namespaces, one carrying the
  # XDP program through a bpf_link. Separate job rather than a step, so a
  # runner that cannot do generic XDP attach on veth does not take the
  # fast gate red with it.
  #
  # Both unknowns are settled: hosted runners do generic XDP attach on
  # veth inside a netns, and two static engines reach Up well inside the
  # 15s wait. Ran continue-on-error for one run to find that out.
  netns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm libbpf-dev linux-tools-common \
                                  python3-pytest iproute2
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          python3 -m pytest --version

      - name: build
        run: make CLANG=clang-21

      # bpftool comes from linux-tools-common plus the running kernel's
      # package; the fixture shells out to it to assert attach state.
      # linux-tools-common ships only the version-dispatching wrapper;
      # the real binary is in linux-tools-<uname -r>, which has no package
      # for every runner kernel. The two engine-death tests skip rather
      # than fail when it is missing - an absent bpftool is not an attach
      # failure, and conflating them produced a confusing assertion once.
      - name: bpftool
        run: |
          sudo apt-get install -y linux-tools-$(uname -r) || \
            echo "no linux-tools for $(uname -r); engine-death tests skip"
          bpftool version || true

      - name: netns end-to-end
        run: sudo make CLANG=clang-21 check-netns
