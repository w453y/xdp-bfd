# /etc/xdp-bfd/engine.conf - arguments for the xdp-bfd service.
#
# Ships empty and the unit ships disabled. Set the arguments, then:
#   systemctl enable --now xdp-bfd
#
# With FRR bfdd pointed at 127.0.0.1:50700 (see
# /usr/share/doc/xdp-bfd/examples/frr-daemons.snippet), replacing eth0
# with the interface the BFD peers are reached over:
#   XDP_BFD_ARGS="--dplane 50700 --kernel-tx eth0"
#
# A Unix socket path works in place of the port with FRR master (released
# FRR cannot connect to one); add --dp-peer frr so bfdd may open it.
#
# --kernel-tx attaches the XDP fast path; without it the engine runs in
# software only. See xdp-bfd(8) for peers on several interfaces.
#
# To restart or upgrade without the peers noticing (systemctl reload
# xdp-bfd), add --dp-hold 30 --pin /run/xdp-bfd-pin; the unit mounts that
# bpffs for its user.
#
# Standalone, one static session, no bfdd:
#   XDP_BFD_ARGS="192.0.2.1 192.0.2.2 --kernel-tx eth0"
#
XDP_BFD_ARGS=""
